version: '3.8'

services:
  backend-test:
    build:
      context: ./backend
      dockerfile: Dockerfile-test
    environment:
      - ENV=test
      - DATABASE_URL=postgresql://test:test@test-db:5432/testdb
    depends_on:
      - test-db

  test-db:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: testdb
    ports:
      - "5433:5432"

  frontend-test:
    build:
      context: ./frontend
      dockerfile: Dockerfile-test
    ports:
      - "3001:3000"